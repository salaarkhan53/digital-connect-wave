name: Deploy Digital Connect Wave

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_SITE_URL: https://digitalconnectwave.com
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: npm run build

      - name: Prepare standalone deployment
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next/static
          cp -r .next/static/. .next/standalone/.next/static/
          mkdir -p .next/standalone/tmp
          touch .next/standalone/tmp/restart.txt

          echo "=== Standalone server.js ==="
          ls -lh .next/standalone/server.js
          echo "=== First lines ==="
          head -20 .next/standalone/server.js

      - name: Deploy to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./.next/standalone/
          server-dir: ./
          # Incremental, not a clean slate on every push.
          #
          # A standalone build is 1,600 files, 1,109 of them node_modules, and
          # `dangerous-clean-slate` deletes the lot and re-sends all of it
          # every time. Four of the first six deploys died partway through that
          # -- once on a rejected filename, once with the server closing the
          # connection -- because it is a very long single FTP session.
          #
          # Without it the action keeps a manifest on the server and sends only
          # what changed, which is a handful of files per push. The action's own
          # guidance is to use clean-slate once and then drop it, which the
          # successful run has now done.
          #
          # If the server ever needs wiping again, set it back to true for one
          # run and remove it after.
          state-name: .ftp-deploy-state.json
